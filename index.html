<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ojele | Portfolio</title>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet"/>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0E0B08;
  --bg2:#161008;
  --cream:#F5F0E8;
  --peach:#E8A98A;
  --salmon:#D4866A;
  --warm:#C07050;
  --mid:#B8A090;
  --card-bg:#1E1610;
  --border:rgba(232,169,138,.18);
  --nav-h:64px;
  --font:'Barlow Condensed',sans-serif;
}

html,body{height:100%}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--cream);
  overflow-x:hidden;
}

/* ───────── NAV ───────── */
nav{
  position:fixed;
  top:0;left:0;right:0;
  height:var(--nav-h);
  background:rgba(14,11,8,.92);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 40px;
  z-index:9000;
}

.nav-brand{
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
}

.nav-logo{
  width:32px;height:32px;
  background:var(--salmon);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
}

.nav-name{
  font-size:14px;
  font-weight:800;
  letter-spacing:.12em;
  text-transform:uppercase;
}

.nav-links{
  display:flex;
  gap:30px;
  list-style:none;
}

.nav-links a{
  font-size:13px;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--mid);
  text-decoration:none;
  position:relative;
  transition:color .25s;
}

/* underline animation */
.nav-links a::after{
  content:'';
  position:absolute;
  left:0;bottom:-4px;
  width:0;height:1.5px;
  background:var(--salmon);
  transition:width .3s;
}

.nav-links a:hover{
  color:var(--salmon);
}

.nav-links a:hover::after{
  width:100%;
}

/* active page animation */
.nav-links a.active{
  color:var(--salmon);
  animation:navPulse .35s ease;
}

.nav-links a.active::after{
  width:100%;
}

@keyframes navPulse{
  0%{transform:translateY(0)}
  50%{transform:translateY(-2px)}
  100%{transform:translateY(0)}
}

/* ───────── PAGES ───────── */
.page{
  display:none;
  min-height:100vh;
  padding-top:var(--nav-h);
}

.page.active{
  display:flex;
  animation:fadeIn .4s ease;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

/* ───────── HERO ───────── */
.hero{
  display:grid;
  grid-template-columns:1fr 1fr;
  min-height:calc(100vh - var(--nav-h));
}

.hero-image-half img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transform:scale(1);
  transition:transform 6s ease;
}

.hero-image-half:hover img{
  transform:scale(1.04);
}

.hero-text-half{
  padding:60px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.hero-title-line{
  font-size:clamp(36px,4vw,70px);
  font-weight:800;
  opacity:0;
  transform:translateY(20px);
}

.hero-title-line.revealed{
  animation:reveal .5s ease forwards;
}

@keyframes reveal{
  to{opacity:1;transform:translateY(0)}
}

/* ───────── WORKS ───────── */
.works-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:3px;
  padding:3px;
}

/* ───────── ABOUT ───────── */
#page-about{
  background:var(--bg);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.about-box{
  background:#1C1208;
  padding:40px;
  max-width:500px;
  text-align:center;
  border:2px solid var(--peach);
  border-radius:12px;
}

.about-box p{
  color:var(--mid);
  font-weight:700;
}

.about-box h2{
  color:var(--cream);
  font-size:48px;
  margin-top:20px;
}

.btn-forgotten{
  margin-top:20px;
  background:var(--peach);
  border:none;
  padding:10px 20px;
  border-radius:8px;
  font-weight:700;
  cursor:pointer;
}

/* ───────── CONTACT ───────── */
#page-contact{
  background:var(--peach);
}

.contact-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:80px 20px;
}

.contact-heading{
  font-size:32px;
  font-weight:800;
  color:var(--bg);
  margin-bottom:30px;
}

.contact-form-box{
  max-width:520px;
  width:100%;
}

.contact-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

input,textarea{
  padding:12px;
  border:none;
  border-radius:6px;
}

/* ───────── FOOTER ───────── */
.site-footer{
  text-align:center;
  padding:16px;
  font-size:10px;
  opacity:.5;
}
</style>
</head>

<body>

<!-- NAV -->
<nav>
  <div class="nav-brand" onclick="showPage('home')">
    <div class="nav-logo">✏️</div>
    <span class="nav-name">Ojele's portfolio</span>
  </div>

  <ul class="nav-links">
    <li><a href="#" id="nav-home" class="active" onclick="showPage('home')">Home</a></li>
    <li><a href="#" id="nav-works" onclick="showPage('works')">Works</a></li>
    <li><a href="#" id="nav-about" onclick="showPage('about')">About</a></li>
    <li><a href="#" id="nav-contact" onclick="showPage('contact')">Contact</a></li>
  </ul>
</nav>

<!-- HOME -->
<div id="page-home" class="page active">
  <section class="hero">
    <div class="hero-image-half">
      <img src="/mnt/user-data/uploads/63632A9E-FBAC-4BDF-9A29-1497E1603456.png" alt="Hero"/>
    </div>

    <div class="hero-text-half">
      <span class="hero-title-line">2D Animator</span>
      <span class="hero-title-line">Character Designer</span>
      <span class="hero-title-line">Illustrator</span>
      <span class="hero-title-line">Freelancer</span>
    </div>
  </section>
</div>

<!-- WORKS -->
<div id="page-works" class="page">
  <div class="works-grid"></div>
</div>

<!-- ABOUT -->
<div id="page-about" class="page">
  <div class="about-box">
    <p>Hello! I am a highly skilled 2D artist...</p>
    <h2>hey I already told you on the landing page👀</h2>
    <button class="btn-forgotten" onclick="showPage('home')">
      you've forgotten, haven't you?
    </button>
  </div>
</div>

<!-- CONTACT -->
<div id="page-contact" class="page">
  <div class="contact-wrap">
    <div class="contact-heading">CONTACT & INQUIRIES</div>

    <div class="contact-form-box">
      <div class="contact-row">
        <input placeholder="Name"/>
        <input placeholder="Email"/>
      </div>
      <textarea placeholder="Message"></textarea>
    </div>
  </div>
</div>

<script>
function setActive(name){
  document.querySelectorAll('.nav-links a')
    .forEach(a=>a.classList.remove('active'));

  const el=document.getElementById('nav-'+name);
  if(el) el.classList.add('active');
}

function showPage(name){
  document.querySelectorAll('.page')
    .forEach(p=>p.classList.remove('active'));

  document.getElementById('page-'+name).classList.add('active');
  setActive(name);

  if(name==='home') runHome();
}

function runHome(){
  const lines=document.querySelectorAll('.hero-title-line');
  lines.forEach((l,i)=>{
    setTimeout(()=>l.classList.add('revealed'), i*120);
  });
}

window.onload=runHome;
</script>

</body>
</html>
